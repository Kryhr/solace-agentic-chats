<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Source Sans 3 (SIL OFL 1.1) — a humanist sans with a calligraphic skeleton, open
      apertures and angled terminals. Chosen over the geometric/neo-grotesque options
      (Geist, Inter, Figtree) because those read technical; this one reads warm and calm
      at the small sizes most of this UI lives at. Source Code Pro (SIL OFL 1.1) is its
      sibling mono, so the two share a skeleton instead of colliding.
      font-display=swap so text is never invisible while the face loads.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300..700&family=Source+Code+Pro:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Solace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
